<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1664ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>现场录入助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>现场录入助手</h1>
  <span id="opBadge" class="op-badge" title="点我设置操作人"></span>
</header>

<main>
  <!-- ============ 录入页 ============ -->
  <section id="view-home" class="view active">
    <div class="loc-banner" id="locBanner">
      <div class="loc-info">
        <span class="loc-label">当前库位</span>
        <b id="locText" class="loc-value">未设置</b>
      </div>
      <button id="btnScanLoc" class="btn btn-small btn-outline">扫库位</button>
    </div>

    <div id="stepCard" class="step-card"></div>

    <div id="readerWrap" class="reader-wrap hidden">
      <div id="reader"></div>
      <div class="scan-tip" id="scanTip"></div>
    </div>

    <div id="manualBox" class="manual-box hidden">
      <input id="manualInput" type="text" autocomplete="off" placeholder="">
      <button id="manualOk" class="btn btn-primary">确认</button>
    </div>

    <div id="qtyForm" class="qty-form hidden">
      <div class="summary-card" id="summaryCard"></div>
      <label class="form-label">数量 <span class="required">*</span></label>
      <input id="qtyInput" type="number" inputmode="decimal" step="any" min="0" placeholder="输入数量">
      <label class="form-label">单位</label>
      <div class="unit-row">
        <button class="unit-chip" data-unit="KG">KG</button>
        <button class="unit-chip" data-unit="EA">EA</button>
        <input id="unitCustom" type="text" placeholder="其他单位" maxlength="8">
      </div>
      <details class="optional-block">
        <summary>保质期 / 生产日期（选填）</summary>
        <label class="form-label">保质期至</label>
        <input id="expInput" type="date">
        <label class="form-label">生产日期</label>
        <input id="mfgInput" type="date">
      </details>
      <div class="btn-row">
        <button id="btnSaveNext" class="btn btn-primary btn-big">保存，继续下一件</button>
        <button id="btnSaveChloc" class="btn btn-outline">保存，更换库位</button>
      </div>
    </div>

    <div class="today-stats" id="todayStats"></div>
  </section>

  <!-- ============ 清单页 ============ -->
  <section id="view-list" class="view">
    <div class="list-toolbar">
      <span id="listCount"></span>
      <input id="listFilter" type="search" placeholder="筛选：代号/批次/库位">
    </div>
    <div class="list-toolbar">
      <button id="btnVoided" class="btn btn-outline btn-small">回收站（0）</button>
      <button id="btnPurge" class="btn btn-danger btn-small hidden">彻底清空回收站</button>
    </div>
    <div id="recordList" class="record-list"></div>
  </section>

  <!-- ============ 导出页 ============ -->
  <section id="view-export" class="view">
    <div class="stat-cards">
      <div class="stat-card"><b id="statTotal">0</b><span>总记录</span></div>
      <div class="stat-card"><b id="statUnsync">0</b><span>未同步</span></div>
      <div class="stat-card"><b id="statToday">0</b><span>今日录入</span></div>
    </div>
    <button id="btnExportXlsx" class="btn btn-primary btn-block">导出 Excel (.xlsx)</button>
    <button id="btnExportCsv" class="btn btn-outline btn-block">导出 CSV</button>
    <button id="btnBackup" class="btn btn-outline btn-block">备份全部数据（.json，可完整恢复）</button>
    <button id="btnRestore" class="btn btn-outline btn-block">从备份文件恢复</button>
    <input id="restoreFile" type="file" accept=".json,application/json" class="hidden">
    <button id="btnCopy" class="btn btn-outline btn-block">复制到剪贴板（可直接粘贴到飞书表格）</button>
    <button id="btnSync" class="btn btn-outline btn-block">同步未同步记录到飞书</button>
    <button id="btnClear" class="btn btn-danger btn-block">清空全部记录</button>
    <p class="hint">同步前请先在「设置」里填写飞书多维表格的自动化 Webhook 地址。</p>
  </section>

  <!-- ============ 设置页 ============ -->
  <section id="view-settings" class="view">
    <div class="form-block">
      <label class="form-label">当前账号</label>
      <p id="acctInfo" class="hint"></p>
      <button id="btnAddAcct" class="btn btn-outline btn-block">新增账号（共用手机时）</button>
      <button id="btnLogout" class="btn btn-outline btn-block">退出登录 / 切换账号</button>
    </div>
    <div class="form-block">
      <label class="form-label">飞书同步 Webhook 地址</label>
      <input id="webhookInput" type="url" placeholder="https://open.feishu.cn/...">
      <button id="btnSaveWebhook" class="btn btn-primary btn-block">保存</button>
      <p class="hint">在飞书多维表格中创建「自动化 → 收到 Webhook 时 → 新增记录」，把生成的地址填到这里。</p>
    </div>
    <div class="form-block">
      <label class="form-label">物料数据</label>
      <p id="matInfo" class="hint"></p>
      <input id="matFile" type="file" accept=".xlsx,.csv" class="hidden">
      <button id="btnImportMat" class="btn btn-outline btn-block">导入新物料表 (xlsx/csv)</button>
      <button id="btnResetMat" class="btn btn-outline btn-block">恢复内置物料表</button>
    </div>
    <p class="hint center">现场录入助手 v1.0 · 离线可用 · 数据保存在本机</p>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="view-home">录入</button>
  <button class="tab" data-view="view-list">清单</button>
  <button class="tab" data-view="view-export">导出</button>
  <button class="tab" data-view="view-settings">设置</button>
</nav>

<div id="toast" class="toast hidden"></div>

<!-- 登录 / 账号 -->
<div id="authOverlay" class="auth hidden">
  <div class="auth-card">
    <h2>现场录入助手</h2>
    <p class="auth-sub" id="authSub">请输入密码继续</p>

    <div id="authSetup" class="hidden">
      <label class="form-label">姓名（操作人）</label>
      <input id="authName" type="text" placeholder="例如：张三" maxlength="20" autocomplete="off">
      <label class="form-label">设置密码</label>
      <input id="authPin" type="password" placeholder="至少 4 位，可含字母数字" maxlength="32">
      <label class="form-label">确认密码</label>
      <input id="authPin2" type="password" placeholder="再输一次" maxlength="32">
      <button id="authSetupOk" class="btn btn-primary btn-block">创建账号并开始录入</button>
      <p class="hint center">预置账号见 data/账号名单.json；本机新建的账号在清理浏览器数据后会丢失</p>
      <button id="authBack" class="btn btn-outline btn-block hidden">返回登录</button>
    </div>

    <div id="authLogin" class="hidden">
      <label class="form-label">账号</label>
      <select id="authUserSel"></select>
      <label class="form-label">密码</label>
      <input id="authPinInput" type="password" placeholder="请输入密码" maxlength="32">
      <button id="authLoginOk" class="btn btn-primary btn-block">登录</button>
      <button id="authNewAcct" class="btn btn-outline btn-block">新建账号</button>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div id="editModal" class="modal hidden">
  <div class="modal-body">
    <h3>编辑记录</h3>
    <div id="editInfo" class="hint"></div>
    <label class="form-label">批次</label><input id="editBatch" type="text">
    <label class="form-label">数量</label><input id="editQty" type="number" step="any" min="0">
    <label class="form-label">单位</label><input id="editUnit" type="text" maxlength="8">
    <label class="form-label">保质期至</label><input id="editExp" type="date">
    <label class="form-label">生产日期</label><input id="editMfg" type="date">
    <div class="btn-row">
      <button id="editSave" class="btn btn-primary">保存</button>
      <button id="editCancel" class="btn btn-outline">取消</button>
    </div>
  </div>
</div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
